# Stack par défaut : application seule avec SQLite (idéal pour tester).
# Utilise l'image construite par GitHub Actions (ghcr.io) : rien n'est compilé sur le serveur.
# Pour construire depuis les sources, ajoutez docker-compose.build.yml (voir README).
services:
  app:
    image: ${IMAGE:-ghcr.io/wdebonne/calendrier-de-l-avent:latest}
    pull_policy: always
    container_name: advent-calendar
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - advent-data:/app/data

volumes:
  advent-data:
