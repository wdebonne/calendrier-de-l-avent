# Stack par défaut : application seule avec SQLite (idéal pour tester).
# Portainer : Stacks > Add stack > Repository > ce fichier.
services:
  app:
    build: .
    image: ${IMAGE:-advent-calendar:latest}
    container_name: advent-calendar
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - advent-data:/app/data

volumes:
  advent-data:
